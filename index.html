<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3355ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Inaro English</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5ff;--card:#fff;--ink:#101842;--mute:#5b6490;--pri:#3355ff;--onpri:#fff;--sun:#ffc933;--ok:#1f9d57;--bad:#d9473c;--line:#d9defa;--g1:#3355ff;--g2:#7a3cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1030;--card:#171d4a;--ink:#eef0ff;--mute:#9aa4dc;--pri:#7f93ff;--onpri:#0c1030;--ok:#4cd08a;--bad:#ff7a6e;--line:#2a3270;--g1:#1b2a9e;--g2:#4a1f9e}}
:root[data-theme="dark"]{--bg:#0c1030;--card:#171d4a;--ink:#eef0ff;--mute:#9aa4dc;--pri:#7f93ff;--onpri:#0c1030;--ok:#4cd08a;--bad:#ff7a6e;--line:#2a3270;--g1:#1b2a9e;--g2:#4a1f9e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,"Segoe UI",Tahoma,sans-serif}
main{max-width:480px;margin:0 auto;padding:14px 14px 120px}
button,input,select{font:700 16px Cairo,system-ui,sans-serif;color:var(--ink)}
button{cursor:pointer;transition:transform .12s}button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:28px 18px 20px;text-align:center;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2),var(--g1));background-size:200% 200%}
.hero>*{position:relative}
.hero>.b{position:absolute;border-radius:50%;filter:blur(30px);opacity:.5}
.b1{width:160px;height:160px;background:#ffc933;top:-50px;left:-40px}
.b2{width:140px;height:140px;background:#ff5d8f;bottom:-40px;right:-30px}
.mark{font:400 clamp(50px,16vw,76px)/.95 "Lilita One",system-ui,sans-serif;color:var(--sun);margin:0 0 10px;direction:ltr;text-shadow:0 4px 0 rgba(0,0,0,.18)}
.ring{position:relative;width:128px;height:128px;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.rt{stroke:rgba(255,255,255,.25)}.rf{stroke:var(--sun);stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:26px;font-weight:900}.ring small{font-size:12px;opacity:.85}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 6px}
.chips span{background:rgba(255,255,255,.18);padding:6px 12px;border-radius:99px;font-size:14px}
.bar,.xb,.dots{height:8px;background:rgba(127,140,200,.25);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.bar i,.xb i,.dots i{display:block;height:100%;background:var(--sun);border-radius:9px;transition:width .6s}
.dots i{background:var(--pri)}
.lv{width:100%;padding:11px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.15);color:#fff}
.lv option{color:#101842}
.go{margin-top:12px;width:100%;padding:16px;border:0;border-radius:16px;background:var(--sun);color:#101842;font-size:20px;font-weight:900;box-shadow:0 5px 0 #c99a00}
.wod{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin:12px 0}
.wod small{color:var(--mute);font-weight:400}.wod p{margin:0;font:400 30px/1.1 "Lilita One",system-ui,sans-serif;direction:ltr;text-align:right}
.wod span{color:var(--pri);font-weight:900}.wod button{border:0;background:var(--pri);color:var(--onpri);width:52px;height:52px;border-radius:50%;font-size:22px}
.row{display:flex;gap:10px;margin-bottom:10px}
.btn,.ghost{flex:1;padding:14px 6px;border-radius:14px;border:2px solid var(--pri);background:var(--pri);color:var(--onpri);font-size:16px}
.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.no{background:transparent;color:var(--ink);border-color:var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 4px}
.top span:first-child{font-weight:900;font-size:20px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:3px 12px;font-size:13px;color:var(--mute)}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:24px 14px;text-align:center;margin-bottom:12px;min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.en{font:400 44px/1.1 "Lilita One",system-ui,sans-serif;margin:0 0 10px;direction:ltr;word-break:break-word}
.ar{font-size:28px;font-weight:900;margin:0;color:var(--pri)}
.hint,.note{color:var(--mute);margin:0;font-size:14px;font-weight:400}.note{font-size:13px;text-align:center;margin:8px 0}
.big{font-size:22px;font-weight:900;margin:0 0 14px}
.fl{perspective:900px;margin:8px 0 10px;cursor:pointer;touch-action:pan-y}
.in{position:relative;min-height:260px;transform-style:preserve-3d}
.fl.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 8px 0 var(--line)}
.face.b{transform:rotateY(180deg);background:var(--pri);border-color:var(--pri);box-shadow:0 8px 0 rgba(0,0,0,.2)}
.face.b .ar{color:var(--onpri);font-size:34px}
.pos{text-align:center;color:var(--mute);margin:0 0 10px;font-size:14px}
.opts{display:grid;gap:10px}
.opt{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:19px;box-shadow:0 4px 0 var(--line)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mg>div{display:grid;gap:10px;align-content:start}
.mt{padding:14px 6px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:16px;box-shadow:0 4px 0 var(--line)}
.mt.sel{border-color:var(--pri);background:var(--pri);color:var(--onpri)}
.mt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.mt.gone{background:var(--ok);border-color:var(--ok);color:#fff;opacity:.35;pointer-events:none}
input,select.f{width:100%;padding:12px;margin-bottom:10px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.dl{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.dl b{direction:ltr;min-width:100px;text-align:left}.dl span{flex:1}
.dl button{border:0;background:transparent;font-size:22px}
details{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px}
summary{font-weight:900;font-size:17px}
.ex{direction:ltr;text-align:left;font-size:18px;margin:10px 0;line-height:1.7}
.dlg{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.dlg b{direction:ltr;display:block}.dlg small{color:var(--mute);font-weight:400}.dlg button{border:0;background:transparent;font-size:22px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:2px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:5}
#nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:0;font-size:11px;color:var(--mute);padding:6px 8px;border-radius:12px;min-width:48px}
#nav button i{font-style:normal;font-size:22px}#nav button.on{color:var(--pri);background:rgba(51,85,255,.12)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);max-width:440px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;text-align:center;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
.fx{position:fixed;transform:translateX(-50%);font-weight:900;font-size:20px;color:#ffb400;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;z-index:9}
.sn{font-size:16px;margin:8px 6px 0;direction:ltr;line-height:1.7;color:var(--mute);font-weight:700}
.sn mark{background:var(--sun);color:#101842;border-radius:7px;padding:1px 7px;font-weight:900;box-shadow:0 0 10px var(--sun)}
.face.b .sn{color:#fff}.sp2{border:0;background:transparent;font-size:19px;padding:0 4px}
.sc{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin:12px 0}
.sc b{display:block;font-size:19px}.sc small{color:var(--mute);font-weight:400;display:block;margin:2px 0 8px}.sc .bar{margin:0}
@media(prefers-reduced-motion:no-preference){
.sn mark{animation:gl 2s ease-in-out infinite}@keyframes gl{50%{box-shadow:0 0 18px 4px var(--sun)}}
.hero{animation:gr 9s ease-in-out infinite}@keyframes gr{50%{background-position:100% 100%}}
.b1{animation:fl1 7s ease-in-out infinite}.b2{animation:fl1 9s ease-in-out infinite reverse}@keyframes fl1{50%{transform:translate(30px,24px) scale(1.2)}}
.mark{animation:pop .6s cubic-bezier(.3,1.5,.5,1)}@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.in{transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.sl{animation:sl .35s ease-out}@keyframes sl{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.opt.ok,.mt.gone{animation:pp .4s}@keyframes pp{50%{transform:scale(1.07)}}
.opt.bad,.mt.bad{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fx{animation:rise .9s ease-out forwards}@keyframes rise{to{transform:translate(-50%,-60px);opacity:0}}
}
</style>
</head>
<body>
<main id="root"></main><canvas id="cv"></canvas><div id="toast" role="status"></div>
<nav id="nav"><button data-t="home" onclick="home()"><i>🏠</i>الرئيسية</button><button data-t="cards" onclick="cards()"><i>🃏</i>بطاقات</button><button data-t="quiz" onclick="quizMenu()"><i>🎯</i>اختبار</button><button data-t="game" onclick="game()"><i>🧩</i>لعبة</button><button data-t="list" onclick="list()"><i>📚</i>الكلمات</button><button data-t="set" onclick="opts()"><i>⚙️</i>خيارات</button></nav>

  let l=pool.filter(i=>(lf==='all'||favs.has(i))&&(!t||W[i][0].toLowerCase().includes(t)||W[i][1].includes(t)));
  const n=l.length;l=l.slice(0,150);
  $('rows').innerHTML=(l.map(i=>'<div class="dl"><b>'+W[i][0]+'</b><span>'+W[i][1]+'</span><button aria-label="مفضلة" onclick="tf('+i+')">'+(favs.has(i)?'⭐':'☆')+'</button><button aria-label="نطق" data-t="'+W[i][0]+'" onclick="say(this.dataset.t)">🔊</button></div>').join('')+(n>150?'<p class="hint">يعرض أول 150 من '+n+'. استخدم البحث.</p>':''))||'<p class="hint">لا توجد نتائج.</p>';
}
function tf(i){if(favs.has(i))favs.delete(i);else favs.add(i);save();rows()}
function lessons(){
  nav('home');
  R.innerHTML=hd('الدروس')+G.map(g=>'<details><summary>'+g[0]+'</summary><p class="ex">'+g[1]+'</p><p class="hint">'+g[2]+'</p></details>').join('')+
  '<details open><summary>محادثة: التعارف</summary>'+D.map(d=>'<div class="dlg"><div><b>'+d[0]+'</b><small>'+d[1]+'</small></div><button aria-label="نطق" data-t="'+d[0]+'" onclick="say(this.dataset.t)">🔊</button></div>').join('')+'</details>';
}
applyTheme();save();home();try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}setInterval(()=>{const e=$('sc');if(e)e.innerHTML=chain()},30000);
</script>
